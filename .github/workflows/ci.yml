name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node scripts/build.mjs
      - name: Verify bundles parse
        run: |
          node --check lib/index.js
          node --check lib/client.js
      - name: Test
        run: node scripts/test.mjs
